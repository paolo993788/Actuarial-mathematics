[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "longevity-risk"
version = "0.1.0"
description = "Lee-Carter mortality projections and C++ Monte Carlo valuation of longevity risk in life annuities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[tool.setuptools]
packages = ["longevity_risk"]
